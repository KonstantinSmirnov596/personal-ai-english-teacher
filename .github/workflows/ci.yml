# Checks that need no GPU: lint, the fast test suite (i18n, JSON schemas, doc links, repository
# hygiene: no keys or personal data). The gpu and e2e suites need an NVIDIA GPU and run locally
# before a release (scripts/check_release.ps1). The same steps run locally: scripts/ci_local.ps1.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv, Python and packages (no hardware check, no models)
        shell: powershell
        run: scripts\setup.ps1 -Dev -NoHardwareCheck -SkipModels -Shortcuts no -NoLaunch

      - name: Lint and fast tests
        shell: powershell
        run: scripts\ci_local.ps1
