name: Bug report (English)
description: Something does not work as described.
labels:
- bug
body:
- type: markdown
  attributes:
    value: 'Never paste an API key. Security problems: see SECURITY.md, not a public issue.'
- type: textarea
  id: what
  attributes:
    label: What happened?
    description: What did you do, what did you expect, and what happened instead?
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
- type: input
  id: version
  attributes:
    label: Personal AI English Teacher version
    description: Shown in the release archive name, for example 0.1.0.
  validations:
    required: true
- type: input
  id: windows
  attributes:
    label: Windows version
- type: input
  id: gpu
  attributes:
    label: Graphics card and video memory
    description: 'For example: RTX 3060 Laptop, 6 GB.'
  validations:
    required: true
- type: input
  id: driver
  attributes:
    label: NVIDIA driver version
- type: dropdown
  id: profile
  attributes:
    label: Profile
    description: Settings → Performance.
    options:
    - completo
    - compacto
    - unsupported
    - I don't know
- type: dropdown
  id: language
  attributes:
    label: Interface language
    options:
    - Español
    - Português
    - Not relevant
- type: input
  id: provider
  attributes:
    label: LLM provider and model (no key)
- type: textarea
  id: log
  attributes:
    label: Log excerpt
    description: 'From %LOCALAPPDATA%\VoiceTutor\logs\voicetutor.log. Better: attach the archive from scripts\collect_diagnostics.ps1.'
    render: text
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy
    options:
    - label: I removed API keys and personal data from everything I attached.
      required: true
